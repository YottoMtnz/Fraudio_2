        function checkTouches(e) {
            e.preventDefault(); let rect = canvas.getBoundingClientRect();
            let prevUp = keys.up; let prevShoot = keys.shoot;
            keys.left = false; keys.right = false; keys.up = false; keys.shoot = false;
            vBtns.left.active = false; vBtns.right.active = false; vBtns.jump.active = false; vBtns.shoot.active = false;
            
            for(let i=0; i<e.touches.length; i++) {
                let tx = (e.touches[i].clientX - rect.left) * cw / rect.width, ty = (e.touches[i].clientY - rect.top) * ch / rect.height;
                let hitLeft = false, hitRight = false;
                
                if (Math.hypot(tx-vBtns.left.x,ty-vBtns.left.y)<vBtns.left.r+12) hitLeft=true;
                else if (Math.hypot(tx-vBtns.right.x,ty-vBtns.right.y)<vBtns.right.r+12) hitRight=true;

                if(hitLeft) { keys.left=true; vBtns.left.active=true; }
                else if(hitRight) { keys.right=true; vBtns.right.active=true; }

                if(Math.hypot(tx-vBtns.jump.x, ty-vBtns.jump.y) < vBtns.jump.r+20) { keys.up=true; vBtns.jump.active=true; }
                if(player && player.hasTorch && Math.hypot(tx-vBtns.shoot.x, ty-vBtns.shoot.y) < vBtns.shoot.r+20) { keys.shoot=true; vBtns.shoot.active=true; }

            if (!prevShoot && keys.shoot) keys.shootPressedThisFrame = true;
        }

        const AudioEngine = {
            ctx: null, masterGain: null, active: false,
            init() {
                if(this.active) return;
                try {
                    const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC();
                    this.masterGain = this.ctx.createGain(); this.masterGain.gain.value = SYSTEM_VOL;
                    this.masterGain.connect(this.ctx.destination);
                    if(this.ctx.state === 'suspended') this.ctx.resume();
                    this.active = true;
                } catch(e) {}
            },
            playSFX(f, type, dur, v, slide=null) {
                if(!this.active) return;
                try {
                    let o = this.ctx.createOscillator(); let g = this.ctx.createGain();
                    o.type = type; o.connect(g); g.connect(this.masterGain);
                    o.frequency.setValueAtTime(f, this.ctx.currentTime);
                    if(slide) o.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime + dur);
                    g.gain.setValueAtTime(v, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
                    o.start(); o.stop(this.ctx.currentTime + dur);
                } catch(e) {}
            },
            jump() { this.playSFX(300, 'sine', 0.2, 0.2, 600); }, bump() { this.playSFX(150, 'triangle', 0.1, 0.3, 50); },
            wallHit() { this.playSFX(90, 'sawtooth', 0.25, 0.4, 40); }, break() { this.playSFX(200, 'square', 0.1, 0.2, 50); setTimeout(()=>this.playSFX(100, 'triangle', 0.1, 0.2, 20), 50); },
            coin() { this.playSFX(F.B5, 'sine', 0.1, 0.2); setTimeout(()=>this.playSFX(F.E5*2, 'sine', 0.3, 0.2), 80); },
            powerupAppears() { this.playSFX(400, 'square', 0.3, 0.1, 800); },
            grow() { let fs=[F.C4,F.E4,F.G4,F.C5,F.E5,F.G5]; fs.forEach((f, i) => setTimeout(()=>this.playSFX(f, 'sine', 0.1, 0.15), i*50)); },
            shrink() { let fs=[F.G5,F.E5,F.C5,F.G4,F.E4,F.C4]; fs.forEach((f, i) => setTimeout(()=>this.playSFX(f, 'triangle', 0.1, 0.15), i*50)); },
            stomp() { this.playSFX(400, 'square', 0.15, 0.2, 100); }, shoot() { this.playSFX(800, 'triangle', 0.15, 0.1, 200); },

                if (this.currentMusic === this.tracks[trackName]) return;
                this.stopMusic();
                if (this.tracks[trackName]) {
                    this.currentMusic = this.tracks[trackName];
                    try {
                        this.currentMusic.currentTime = 0;
                        let p = this.currentMusic.play();
                        if(p !== undefined) p.catch(e => {}); 
                    } catch(e) {}
                }

            stopMusic() {
                if (this.currentMusic) {
                    this.currentMusic.pause();
                    // Importante: No resetear currentTime aquí previene errores de "The play() request was interrupted by a call to pause()"
                    this.currentMusic = null;
                }
            },
            playSFX(trackName) {
                if (this.tracks[trackName]) {
                    try {
                        // Pausar primero evita que el navegador se ahogue de estados intentando cargar de nuevo
                        this.tracks[trackName].pause(); 
                        this.tracks[trackName].currentTime = 0;
                        let p = this.tracks[trackName].play();
                        if(p !== undefined) p.catch(e => {});

                    this.vy += PHYS.GRAVITY * dt; this.y += this.vy * dt; let onGround = false;
                    for(let b of checkBlocks) {
                        if(AABB(this, b)) {
                            if(this.vy > 0) { this.y = b.y - this.h; this.vy = 0; onGround = true; } 
                            else if (this.vy < 0) { this.y = b.y + b.h; this.vy = 0; }
                        }
                    }
                    if(onGround) {
                        let edge = false, checkX = this.x + (this.vx > 0 ? this.w + 5 : -5);
                        for(let b of checkBlocks) { if (checkX >= b.x && checkX <= b.x + b.w && Math.abs((this.y+this.h)-b.y) < 5) { edge = true; break; } }
                        if(!edge) this.vx *= -1;
                        if (this.type === 'jump') { this.jumpTimer -= dt; if (this.jumpTimer <= 0) { this.vy = -600; this.jumpTimer = Math.random() * 2 + 2; } }
                    }
                } else if (this.type === 'shoot') {
                    this.vy += PHYS.GRAVITY * dt; this.y += this.vy * dt;
                    for(let b of checkBlocks) { if(AABB(this, b) && this.vy > 0) { this.y = b.y - this.h; this.vy = 0; } }
                    this.shootTimer -= dt;
                    if(this.shootTimer <= 0 && Math.abs(this.x - player.x) < 800 && projectiles.length === 0) {

                    }
                } else if (this.type === 'fly') {
                    this.x += this.vx * dt; this.y = this.startY + Math.sin(this.animTimer * 2) * 40;
                }
                this.animTimer += dt * 5;
                if(state.current === GAME_STATES.PLAYING && Math.abs(this.x - player.x) < 100 && AABB(this, player)) {
                    if(player.satelliteTimer > 0 || player.godMode) this.die(true);
                    else if(player.vy > 0 && player.y + player.h - (player.vy*dt) <= this.y + this.h/2) { this.die(false); player.vy = PHYS.BOUNCE_FORCE; hitStopTimer = 0.08; } 
                    else player.damage();
                }
            }
            die(fromSat) {
                this.dead = true; AudioEngine.stomp(); state.score += (this.type === 'fly' ? 300 : 200);
                spawnText(this.type === 'fly' ? "300" : "200", this.x, this.y, '#fff'); spawnExplosion(this.x+this.w/2, this.y+this.h/2, fromSat ? '#00d2d3' : WC[state.world].eM, 15);
            }
            draw(ctx) {

                ctx.translate(this.x + this.w/2, this.y + this.h);
                let pX = player ? player.x : (this.x - 100); let dir = (pX < this.x) ? 1 : -1; 
                if((this.type==='walk' || this.type==='jump' || this.type==='fly') && this.vx > 0) dir = -1;
                ctx.scale(dir, 1); ctx.rotate(Math.sin(this.animTimer) * 0.15);
                
                let bodyCol = this.type === 'shoot' ? WC[state.world].eR : WC[state.world].eM;
                
                let enGrd = ctx.createRadialGradient(-5, -20, 2, 0, -15, 20);
                enGrd.addColorStop(0, '#fff'); enGrd.addColorStop(0.3, bodyCol); enGrd.addColorStop(1, '#000');
                
                ctx.fillStyle = enGrd; ctx.beginPath();
                if(this.type === 'walk' || this.type === 'jump' || this.type === 'fly') { 
                    ctx.moveTo(0, -25); ctx.quadraticCurveTo(-25, -25, -15, -5); ctx.lineTo(15, -5); ctx.quadraticCurveTo(25, -25, 0, -25); ctx.fill(); 
                    if (this.type === 'jump') { ctx.fillStyle = '#f1c40f'; ctx.fillRect(-15, -5, 30, 5); }
                    if (this.type === 'fly') { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); let wingY = Math.sin(this.animTimer * 15) * 5; ctx.ellipse(5, -20 + wingY, 12, 5, -0.3, 0, Math.PI*2); ctx.fill(); }
                } else { ctx.roundRect(-12, -30, 24, 25, 5); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-10, -15, 6, 0, Math.PI*2); ctx.fill(); }
                
                ctx.fillStyle = '#2c3e50'; ctx.beginPath(); ctx.ellipse(-8, -2, 6, 4, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(8, -2, 6, 4, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-5, -20, 4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(5, -20, 4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-6, -20, 2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(4, -20, 2, 0, Math.PI*2); ctx.fill();
                
                ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-12, -26); ctx.lineTo(-2, -22); ctx.moveTo(12, -26); ctx.lineTo(2, -22); ctx.stroke();

        class Projectile {

        class Particle {
            constructor(x, y, col) {
                this.x=x; this.y=y; this.col=col; let ang=Math.random()*Math.PI*2, spd=Math.random()*300+100;
                this.vx=Math.cos(ang)*spd; this.vy=Math.sin(ang)*spd - 150; this.life=1; this.size = Math.random()*5+2;
            }
            update(dt) { this.vy += PHYS.GRAVITY * dt; this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt * 1.5; }
            draw(ctx) { if(this.life<=0) return; ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.col; ctx.fillRect(this.x, this.y, this.size, this.size); ctx.globalAlpha = 1; }
        }

            constructor(x, y, vx, vy) { this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.life = 1; this.rot = Math.random()*Math.PI; this.rotSpeed = (Math.random()-0.5)*15; }
            update(dt) { this.vy += PHYS.GRAVITY * dt; this.x += this.vx * dt; this.y += this.vy * dt; this.rot += this.rotSpeed * dt; this.life -= dt * 1.2; }
            draw(ctx) { if(this.life <= 0) return; ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot); ctx.fillStyle = '#c0392b'; ctx.fillRect(-8, -8, 16, 16); ctx.restore(); }

        class Flagpole {
            constructor(x, baseY) { this.x = x; this.baseY = baseY; this.h = Math.min(TILE * 9, Math.max(180, baseY - 110)); this.y = baseY - this.h; this.w = 16; this.state = 'idle'; this.animTimer = 0; }
            update(dt) { if(this.state !== 'idle') this.animTimer += dt * 5; }

                ctx.save(); let poleCenter = this.x + this.w/2; let globalWave = performance.now() / 200;

                let poleGrd = ctx.createLinearGradient(this.x, 0, this.x + this.w, 0);
                poleGrd.addColorStop(0, '#7f8c8d'); poleGrd.addColorStop(0.5, '#ecf0f1'); poleGrd.addColorStop(1, '#95a5a6');
                ctx.fillStyle = poleGrd;
                if (this.state === 'top') { for(let by = this.y; by <= this.baseY; by += 5) { let waveX = Math.sin(this.animTimer * 10 + (by * 0.05)) * 10; ctx.fillRect(this.x + waveX, by, this.w, 6); } } 
                else { ctx.fillRect(this.x, this.y, this.w, this.h); }
                
                let ballX = poleCenter; let ballY = this.y - 12; if (this.state === 'top') ballX += Math.sin(this.animTimer * 10 + (this.y * 0.05)) * 10;
                let grd = ctx.createRadialGradient(ballX - 5, ballY - 5, 2, ballX, ballY, 18); grd.addColorStop(0, '#f1c40f'); grd.addColorStop(1, '#d35400'); ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(ballX, ballY, 18, 0, Math.PI*2); ctx.fill();
                
                let flagX = this.x + this.w; let flagY = this.y + 15; if (this.state === 'top') flagX += Math.sin(this.animTimer * 10 + (flagY * 0.05)) * 10;
                let fTipY = flagY + 25 + Math.sin(globalWave)*8; ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.moveTo(flagX, flagY); ctx.lineTo(flagX + 70, fTipY); ctx.lineTo(flagX, flagY + 50); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(flagX + 22, flagY + 25, 12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 16px Arial Black'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('F', flagX + 22, flagY + 27); ctx.restore();
            }
        }

        function buildParallax() {
            decors = { layer2: [], layer3: [], layer4: [] }; const tw = LEVEL_LENGTH * TILE;
            for(let i=0; i<tw; i+=400) decors.layer2.push({x: i + Math.random()*200, w: 300+Math.random()*200, h: 200+Math.random()*150 });
            for(let i=0; i<tw; i+=250) decors.layer3.push({x: i + Math.random()*100, r: 100+Math.random()*100 });
            for(let i=0; i<tw; i+=100) decors.layer4.push({x: i + Math.random()*50, r: 20+Math.random()*40 });
            
            weatherParticles = []; for(let i=0; i<28; i++) weatherParticles.push(new WeatherParticle());
            birds = []; for(let i=0; i<5; i++) birds.push(new BirdParticle());
            clouds = []; for(let i=0; i<7; i++) clouds.push(new CloudParticle()); 
            confettis = []; 
        }

        buildParallax();

        function drawParallax(camX) {
            let wC = WC[state.world];
            let grd = ctx.createLinearGradient(0,0,0,ch); grd.addColorStop(0, wC.sT); grd.addColorStop(1, wC.sB);
            ctx.fillStyle = grd; ctx.fillRect(0,0,cw,ch);
            
            let voidGrd = ctx.createLinearGradient(0, state.floorY, 0, ch);
            voidGrd.addColorStop(0, wC.sB); voidGrd.addColorStop(0.2, wC.gB); voidGrd.addColorStop(0.8, '#000000'); 
            ctx.fillStyle = voidGrd; ctx.fillRect(0, state.floorY, cw, ch - state.floorY);

            let anim = Date.now() / 1000;
            let celX = cw*0.8 - camX*0.005;
            let celY = ch*0.2 + Math.sin(anim * 1.5) * 8; 
            
            ctx.save(); ctx.translate(celX, celY); ctx.rotate(Math.sin(anim * 0.5) * 0.05); 
            
            if(state.world===1||state.world===2||state.world===5) { 
                let pulse = 1 + Math.sin(anim * 3) * 0.1;
                let sunGrd = ctx.createRadialGradient(0, 0, 45, 0, 0, 80 * pulse);
                sunGrd.addColorStop(0, 'rgba(255, 220, 0, 0.5)'); sunGrd.addColorStop(1, 'rgba(255, 220, 0, 0)');
                ctx.fillStyle = sunGrd; ctx.beginPath(); ctx.arc(0, 0, 80 * pulse, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI*2); ctx.fill();
                ctx.lineWidth = 4; ctx.strokeStyle = '#FFA500'; ctx.stroke();
                
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(-12, -8, 4, 10, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(12, -8, 4, 10, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(-13, -13, 2.5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(11, -13, 2.5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'rgba(255, 100, 100, 0.7)'; ctx.beginPath(); ctx.ellipse(-20, 6, 7, 4, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(20, 6, 7, 4, 0, 0, Math.PI*2); ctx.fill();
            }
            if(state.world===3||state.world===6||state.world===8) { 
                ctx.fillStyle='#ecf0f1'; ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI*2); ctx.fill(); 
                ctx.fillStyle=wC.sT; ctx.beginPath(); ctx.arc(-10, -10, 35, 0, Math.PI*2); ctx.fill(); 
                drawKawaiiFace(ctx, 5, 0, 35);
            }
            ctx.restore();

            ctx.globalAlpha = 0.8;
            ctx.fillStyle = wC.m; for(let d of decors.layer2) { let px = (d.x - camX * 0.1); if(px > -d.w && px < cw) { ctx.beginPath(); ctx.moveTo(px, state.floorY); ctx.quadraticCurveTo(px+d.w/2, state.floorY-d.h*1.5, px+d.w, state.floorY); ctx.fill(); } }
            ctx.fillStyle = wC.h; for(let d of decors.layer3) { let px = (d.x - camX * 0.3); if(px > -d.r && px < cw+d.r) { ctx.beginPath(); ctx.arc(px, state.floorY, d.r, Math.PI, 0); ctx.fill(); } }
            ctx.fillStyle = wC.b; for(let d of decors.layer4) { let px = (d.x - camX * 0.6); if(px > -d.r && px < cw+d.r) { ctx.beginPath(); ctx.arc(px, state.floorY, d.r, Math.PI, 0); ctx.fill(); } }
            ctx.globalAlpha = 1.0;
        }

        function generateLevel(keepState) {
            let oldForm = 'small', oldSat = 0, oldTorch = false, oldGodMode = false; 
            if(keepState && player) { oldForm = player.form; oldSat = player.satelliteTimer; oldTorch = player.hasTorch; oldGodMode = player.godMode; }
            
            blocks = []; enemies = []; projectiles = []; playerProjectiles = []; items = []; particles = []; texts = []; meteors = [];
            
            state.floorY = ch - 110; let curX = 0;
            for(let h = 0; h < 15; h++) blocks.push(new Block(-TILE, state.floorY - (h * TILE) + TILE, 'empty'));
            for(let i=0; i<15; i++) { for(let d=0; d<6; d++) blocks.push(new Block(curX, state.floorY + d*TILE, d === 0 ? 'ground' : 'underground')); curX += TILE; }
            
            player = new Player(150, state.floorY - 50); player.setSize(oldForm); player.satelliteTimer = oldSat; player.hasTorch = oldTorch; player.godMode = oldGodMode;
            
            let phone1 = Math.floor(LEVEL_LENGTH * 0.3), phone2 = Math.floor(LEVEL_LENGTH * 0.7);
            let heartPos = Math.floor(LEVEL_LENGTH * 0.5), torchPos = Math.floor(LEVEL_LENGTH * 0.4); 
            let mult = state.difficulty === 0 ? 1 : (state.difficulty === 1 ? 2 : 4);
            let numEnemies = (2 + (state.world * 2)) * mult;
            let enemyPositions = new Set(); while(enemyPositions.size < numEnemies) enemyPositions.add(Math.floor(Math.random() * (LEVEL_LENGTH - 40)) + 25);

            for(let i=15; i<LEVEL_LENGTH; i++) {
                if(Math.random() < 0.1 && i !== heartPos && i !== torchPos) {
                    let gap = Math.floor(Math.random()*2) + 1; curX += TILE * gap; i += gap;
                    for(let j=0; j<5; j++) { for(let d=0; d<6; d++) blocks.push(new Block(curX, state.floorY + d*TILE, d === 0 ? 'ground' : 'underground')); curX += TILE; i++; } continue;
                }
                for(let d=0; d<6; d++) blocks.push(new Block(curX, state.floorY + d*TILE, d === 0 ? 'ground' : 'underground'));
                if (i === heartPos) blocks.push(new Block(curX, state.floorY - TILE*3, 'question', 'heart'));
                else if (i === torchPos) blocks.push(new Block(curX, state.floorY - TILE*3, 'question', 'torch'));
                else if(Math.random() < 0.25) {
                    let h = Math.floor(Math.random()*2) + 3;
                    if(Math.random() < 0.3) blocks.push(new Block(curX, state.floorY - TILE*h, 'brick'));
                    else {
                        let content = 'coin'; if(Math.abs(i - phone1) < 10) { content = 'telephone'; phone1 = -100; } else if(Math.abs(i - phone2) < 10) { content = 'telephone'; phone2 = -100; }
                        blocks.push(new Block(curX, state.floorY - TILE*h, 'question', content));
                    }
                }
                if(enemyPositions.has(i)) {
                    let type = 'walk', r = Math.random();
                    if (state.world >= 2 && r < 0.3) type = 'fly'; else if (state.world >= 3 && r < 0.5) type = 'jump'; else if (state.world >= 4 && r < 0.7) type = 'shoot';
                    let eY = (type === 'fly') ? state.floorY - TILE*2 : state.floorY; enemies.push(new Enemy(curX + TILE/2, eY, type));
                }
                curX += TILE;
            }
            
            for(let i=0; i<20; i++) { for(let d=0; d<6; d++) blocks.push(new Block(curX, state.floorY + d*TILE, d === 0 ? 'ground' : 'underground')); curX += TILE; }
            goal = new Flagpole(curX - TILE*10, state.floorY); 
            
            let stairStart = goal.x - TILE * 11;
            for (let col = 0; col < 8; col++) { for (let row = 0; row <= col; row++) { let step=new Block(stairStart + col * TILE, state.floorY - TILE - row * TILE, 'stair');step.topStep=row===col;blocks.push(step); } }
            buildParallax();
        }

        function die(isPitFall = false) {
            if(state.current === GAME_STATES.DEAD || state.current === GAME_STATES.GAMEOVER) return;
            
            if(externalAudioInitialized) {
                ExternalAudio.stopMusic();
                if(ExternalAudio.tracks.alarm30 && !ExternalAudio.tracks.alarm30.paused) {
                    ExternalAudio.tracks.alarm30.pause();
                    try { ExternalAudio.tracks.alarm30.currentTime = 0; } catch(e){}
                }
            }

            if(isPitFall) {
                if(externalAudioInitialized) ExternalAudio.playSFX('fall');
            } else {
                AudioEngine.die();
            }

            player.vy = PHYS.JUMP_FORCE; state.lives--;
            state.current = state.lives <= 0 ? GAME_STATES.GAMEOVER : GAME_STATES.DEAD;
            
            if (state.current === GAME_STATES.GAMEOVER) {
                setTimeout(() => {
                    if (externalAudioInitialized) ExternalAudio.playSFX('gameOver');
                }, isPitFall ? 1500 : 800);
            }

            setTimeout(() => { 
                if(state.current === GAME_STATES.DEAD) resetGame('death'); 
                else if(state.current === GAME_STATES.GAMEOVER) resetGame('menu'); 
            }, 4000);
        }

        function winLevel() {
            if(state.current === GAME_STATES.WIN || state.current === GAME_STATES.ENDING) return;
            state.score += Math.floor(state.time) * 10;
            if (goal.state === 'top') {player.y = Math.max(96, goal.y + 30); player.vy = 0; player.x = goal.x - player.w + 5;} player.invulnTimer = 0;
            
            if(externalAudioInitialized) ExternalAudio.stopMusic();

            if (state.world >= 8) { 
                state.current = GAME_STATES.ENDING; 
                state.menuTimer = 0; 
            } 
            else { 
                state.current = GAME_STATES.WIN; 
                if(externalAudioInitialized) ExternalAudio.playSFX('win');
                setTimeout(() => { if(state.current===GAME_STATES.WIN)resetGame('next'); }, 4000); 
            }

            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    if (state.current !== GAME_STATES.WIN && state.current !== GAME_STATES.ENDING) return;
                    let fx = goal.x + (Math.random() - 0.5) * 500, fy = goal.baseY - 100 - Math.random() * (ch * 0.7);
                    spawnExplosion(fx, fy, `hsl(${Math.random()*360},100%,50%)`, 40);
                    if (state.current !== GAME_STATES.ENDING) AudioEngine.playSFX(200 + Math.random()*400, 'triangle', 0.15, 0.1, 50);
                }, i * 150);
            }
        }

        function resetGame(reason) {
            let keepState = false;
            if (reason === 'menu') { state.current = GAME_STATES.MENU; state.menuTimer = 0; state.showDifficulties = false; return; } 
            else if (reason === 'start') { state.lives = 5; state.score = 0; state.world = 1; player = null; } 
            else if (reason === 'death') {} 
            else if (reason === 'next') { state.world++; keepState = true; } 
            
            state.time = 120; 
            
            if (externalAudioInitialized) {
                ExternalAudio.isHurried = false;
                ExternalAudio.lastSatState = false;
                if(ExternalAudio.tracks.alarm30) {
                    ExternalAudio.tracks.alarm30.onended = null;
                    ExternalAudio.tracks.alarm30.pause();
                    try { ExternalAudio.tracks.alarm30.currentTime = 0; } catch(e){}
                }
            }

            generateLevel(keepState);

function natural(n,fallback=0){return Number.isSafeInteger(n)&&n>=0?n:fallback;}
function cleanProfile(p){let q=blankProfile();if(!p||typeof p!=='object')return q;q.unlocked=Math.max(1,Math.min(8,natural(p.unlocked,1)));q.world=Math.max(1,Math.min(q.unlocked,natural(p.world,1)));q.checkpoint=Math.min(2,natural(p.checkpoint));for(let w=1;w<=8;w++){q.done[w]=!!p.done?.[w];q.medals[w]=natural(p.medals?.[w])&7;}for(let k=1;k<=3;k++){q.tun[k]=!!p.tun?.[k];q.tunDone[k]=!!p.tunDone?.[k];}for(let key of Object.keys(p.coins||{})){if(/^[\w:.-]{1,70}$/.test(key)&&Array.isArray(p.coins[key]))q.coins[key]=[...new Set(p.coins[key].filter(n=>Number.isSafeInteger(n)&&n>=0))];}for(let key of Object.keys(p.blocks||{})){if(/^[\w:.,-]{1,80}$/.test(key)){let b=p.blocks[key];if(b==='removed'||(b&&Number.isInteger(b.hits)))q.blocks[key]=b==='removed'?b:{hits:Math.max(0,Math.min(10,b.hits)),spent:!!b.spent};}}for(let field of ['frontiers','anchors'])for(let key of Object.keys(p[field]||{})){let x=p[field][key];if(/^(w[1-8]|aurora)$/.test(key)&&Number.isFinite(x)&&x>=0&&x<=40000)q[field][key]=x;}q.extraDone=!!p.extraDone;return q;}
